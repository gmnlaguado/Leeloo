name: iOS Build & Submit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (root workspace)
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Write .env for build
        working-directory: apps/mobile
        run: |
          echo 'EXPO_PUBLIC_API_URL=https://leeloo-api-55i5.onrender.com' > .env
          echo 'EXPO_PUBLIC_AI_ORCHESTRATOR_URL=https://leeloo-ai.onrender.com' >> .env
          echo 'EXPO_PUBLIC_SUPABASE_URL=https://gqilzzhzmxjjfpdmrmea.supabase.co' >> .env
          echo 'EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_Y2xlcmsubGVlbG9vLnVzJA' >> .env

      - name: Build iOS local (no EAS cloud credits)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsubGVlbG9vLnVzJA
          EXPO_PUBLIC_API_URL: https://leeloo-api-55i5.onrender.com
          EXPO_PUBLIC_AI_ORCHESTRATOR_URL: https://leeloo-ai.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: https://gqilzzhzmxjjfpdmrmea.supabase.co
        run: eas build --local --platform ios --profile production --non-interactive

      - name: Find IPA
        id: ipa
        working-directory: apps/mobile
        run: |
          IPA=$(find . -name "*.ipa" 2>/dev/null | head -1 | sed 's|^\./||')
          echo "path=$IPA" >> $GITHUB_OUTPUT
          echo "Found IPA: $IPA"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leeloo-ios-build-${{ github.run_number }}
          path: apps/mobile/${{ steps.ipa.outputs.path }}
          retention-days: 30

      - name: Submit to App Store Connect (with retry)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          IPA="${{ steps.ipa.outputs.path }}"
          echo "Submitting IPA: $IPA"
          for attempt in 1 2 3; do
            echo "--- Submit attempt $attempt/3 ---"
            # --profile production loads ASC credentials from eas.json
            # timeout 1800s (30 min) prevents EAS waiting loop from killing the job
            if eas submit \
                --platform ios \
                --path "$IPA" \
                --profile production \
                --non-interactive; then
              echo "✅ Submit succeeded on attempt $attempt"
              exit 0
            fi
            EXIT_CODE=$?
            if [ $attempt -lt 3 ]; then
              echo "⚠️ Submit attempt $attempt failed (exit $EXIT_CODE), waiting 90s before retry..."
              sleep 90
            fi
          done
          echo "❌ All 3 submit attempts failed."
          echo "IPA saved as artifact — download and submit manually via Transporter or App Store Connect."
          exit 1
