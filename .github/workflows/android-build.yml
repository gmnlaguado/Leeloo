name: Android Build & Upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Write .env for build
        working-directory: apps/mobile
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_API_URL=https://leeloo-api-55i5.onrender.com
          EXPO_PUBLIC_AI_ORCHESTRATOR_URL=https://leeloo-ai.onrender.com
          EXPO_PUBLIC_SUPABASE_URL=https://gqilzzhzmxjjfpdmrmea.supabase.co
          EOF

      - name: Build Android local (no EAS cloud credits)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform android --profile production --non-interactive

      - name: Find AAB
        id: aab
        run: |
          AAB=$(find apps/mobile -name "*.aab" 2>/dev/null | head -1)
          echo "path=$AAB" >> $GITHUB_OUTPUT
          echo "Found AAB: $AAB"

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leeloo-android-build-${{ github.run_number }}
          path: ${{ steps.aab.outputs.path }}
          retention-days: 30
