name: Android Build & Upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli@12

      - name: Write .env for build
        working-directory: apps/mobile
        run: |
          echo 'EXPO_PUBLIC_API_URL=https://leeloo-api-55i5.onrender.com' > .env
          echo 'EXPO_PUBLIC_AI_ORCHESTRATOR_URL=https://leeloo-ai.onrender.com' >> .env
          echo 'EXPO_PUBLIC_SUPABASE_URL=https://gqilzzhzmxjjfpdmrmea.supabase.co' >> .env

      - name: Build Android local (no EAS cloud credits)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform android --profile production-ci --non-interactive

      - name: Find APK
        id: apk
        run: |
          APK=$(find apps/mobile -name "*.apk" 2>/dev/null | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leeloo-android-v9-run${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
