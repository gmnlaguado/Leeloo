name: Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build API
        run: cd services/api && npm run build
      
      - name: Deploy all Render services
        env:
          HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          HOOK_AI: ${{ secrets.RENDER_DEPLOY_HOOK_AI_URL }}
          HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER_URL }}
        run: |
          deploy() { [ -n "$1" ] && curl -fsS -X POST "$1" && echo "✅ $2 hook triggered" || echo "⚠️ $2 hook not configured"; }
          deploy "$HOOK_API"    "leeloo-api"
          deploy "$HOOK_AI"     "leeloo-ai"
          deploy "$HOOK_WORKER" "leeloo-worker"

  deploy-mobile:
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build and submit iOS
        run: |
          cd apps/mobile
          eas build --platform ios --non-interactive
          eas submit --platform ios --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      
      - name: Build and submit Android
        run: |
          cd apps/mobile
          eas build --platform android --non-interactive
          eas submit --platform android --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
